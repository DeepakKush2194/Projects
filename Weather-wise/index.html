<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6B8DD6 0%, #8E37D7 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            /* color: white; */
        }

        .search-box {
            text-align: center;
            margin: 30px 0;
        }

        input {
            padding: 15px 25px;
            width: 60%;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            background: #FF6B6B;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff5252;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .weather-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .temp {
            font-size: 48px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .unit-toggle {
            margin-top: 10px;
            text-align: center;
        }

        .unit-toggle button {
            background: none;
            border: 1px solid white;
            padding: 5px 15px;
            margin: 0 5px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }

        .unit-toggle button.active {
            background: white;
            color: #6B8DD6;
        }

        .recent-searches {
            margin: 20px 0;
            text-align: center;
        }

        .recent-searches button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 15px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .recent-searches button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .location-button {
            background: #4A90E2;
            padding: 15px 25px;
        }

        .location-button:hover {
            background: #357ABD;
        }

        /* 5-day forecast */
        .forecast-container {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .forecast-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        /* Autocomplete */
        .autocomplete-dropdown {
            position: absolute;
            width: 60%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            margin-top: -10px;
        }

        .autocomplete-item {
            padding: 10px 15px;
            color: #333;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .autocomplete-item:hover {
            background-color: #f5f5f5;
        }

        .search-box {
            position: relative;
        }

        @media (max-width: 600px) {
            .autocomplete-dropdown {
                width: 100%;
            }
        }

        /* 3.Theme switch */
        [data-theme="day"] {
            --text-color: #2c3e50;
            --card-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="day"] body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: var(--text-color);
        }

        [data-theme="day"] .weather-card,
        [data-theme="day"] .forecast-container,
        [data-theme="day"] .chart-container {
            background: var(--card-bg);
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="day"] .recent-searches button,
        [data-theme="day"] .unit-toggle button {
            background: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        [data-theme="day"] .unit-toggle button.active {
            background: #6B8DD6;
            color: white;
        }

        [data-theme="day"] input {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border: 1px solid #ddd !important;
        }

        [data-theme="day"] #weatherIcon {
            filter: brightness(0.8);
        }


        [data-theme="day"] #temperatureChart {
            --chart-text-color: #333;
        }

        [data-theme="day"] .chart-container .scales text {
            fill: var(--chart-text-color) !important;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .logo {
            width: 50px;
            height: 50px;
            filter: invert(30%);
        }

        [data-theme="night"] .logo {
            filter: invert(90%);
        }

        [data-theme="night"] body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
        }

        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .theme-switcher button {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        [data-theme="day"] .theme-switcher button {
            background: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        /* 4.error handling */
        .error-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff4444;
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            animation: slideIn 0.3s ease-out;
        }

        /* AQI section */
        .aqi-section {
            margin: 20px 0;
        }

        .aqi-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .aqi-badge h3 {
            font-size: 24px;
            margin: 5px 0;
        }

        /* Chart */
        .chart-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
        }

        #temperatureChart {
            max-height: 300px;
            width: 100% !important;
        }

        @media (max-width: 600px) {
            .chart-container {
                padding: 15px;
            }
        }

        /* AQI Color Classes */
        .aqi-good {
            background: #4CAF50 !important;
        }

        .aqi-fair {
            background: #FFEB3B !important;
            color: #333 !important;
        }

        .aqi-moderate {
            background: #FF9800 !important;
        }

        .aqi-poor {
            background: #F44336 !important;
        }

        .aqi-very-poor {
            background: #9C27B0 !important;
        }

        .share-section {
            margin-top: 20px;
            text-align: center;
        }

        .share-button {
            background: rgba(255, 255, 255, 0.15) !important;
            padding: 10px 20px !important;
            margin: 10px 0 !important;
        }

        .social-share {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .social-button {
            background: rgba(255, 255, 255, 0.1) !important;
            padding: 8px 15px !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        [data-theme="day"] .share-button,
        [data-theme="day"] .social-button {
            background: rgba(0, 0, 0, 0.05) !important;
            color: #333 !important;
            border-color: rgba(0, 0, 0, 0.1) !important;
        }

        @keyframes slideIn {
            from {
                top: -50px;
            }

            to {
                top: 20px;
            }
        }

        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }

            input,
            button {
                width: 100%;
                margin-bottom: 10px;
            }

            #fahrenheitBtn{
                margin-top: 10px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .header {
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <!-- <img src="weatherwise-logo.png" alt="Logo" class="logo"> -->
            <h1>WeatherWise 🌦️</h1>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Enter city name..." id="cityInput">
            <!-- Add this inside your search-box div, right after the input field -->
            <div class="autocomplete-dropdown" id="autocompleteDropdown" style="display: none;"></div>
            <button onclick="getWeather()">Search</button>
            <button class="location-button" onclick="getLocation()">📍 Current Location</button>
        </div>

        <div class="recent-searches" id="recentSearches"></div>
        <div class="loading">Loading...</div>

        <div class="weather-card" id="weatherCard" style="display: none;">
            <div class="location">
                <h2 id="cityName">City Name</h2>
                <p id="weatherDesc">Weather Description</p>
            </div>

            <div class="weather-info">
                <div class="temp">
                    <span id="temperature">25</span>
                    <span id="tempUnit">°C</span>
                </div>
                <img id="weatherIcon" src="" alt="Weather Icon">
            </div>

            <div class="unit-toggle">
                <button id="celsiusBtn" class="active" onclick="toggleUnit('celsius')">°C</button>
                <button id="fahrenheitBtn" onclick="toggleUnit('fahrenheit')">°F</button>
            </div>

            <div class="aqi-section">
                <div class="aqi-badge" id="aqiBadge">
                    <span>Air Quality</span>
                    <h3 id="aqiValue">-</h3>
                    <p id="aqiText">Loading...</p>
                </div>
            </div>

            <div class="details">
                <div class="detail-item">
                    <p>Feels Like</p>
                    <h3 id="feelsLike">24</h3>
                    <span id="feelsLikeUnit">°C</span>
                </div>
                <div class="detail-item">
                    <p>Humidity</p>
                    <h3 id="humidity">60</h3>%
                </div>
                <div class="detail-item">
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">5.5</h3>km/h
                </div>
                <div class="detail-item">
                    <p>Pressure</p>
                    <h3 id="pressure">1012</h3>hPa
                </div>
            </div>

            <div class="theme-switcher">
                <button onclick="toggleTheme('day')">☀️ Day</button>
                <button onclick="toggleTheme('night')">🌙 Night</button>
            </div>
        </div>

        <div class="share-section">
            <button onclick="shareWeather()" class="share-button">📤 Share</button>
            <div class="social-share" id="socialShare" style="display: none;">
                <button onclick="copyLink()" class="social-button">🔗 Copy Link</button>
                <button onclick="shareTwitter()" class="social-button">🐦 Twitter</button>
                <button onclick="shareFacebook()" class="social-button">📘 Facebook</button>
            </div>
        </div>

        <!-- Add after weather-card div -->
        <div class="forecast-container" id="forecastContainer" style="display: none;">
            <h3>5-Day Forecast</h3>
            <div class="forecast-cards" id="forecastCards"></div>
        </div>

        <!-- Add this after the forecast container -->
        <div class="chart-container" id="chartContainer" style="display: none;">
            <h3>24-Hour Temperature Chart</h3>
            <canvas id="temperatureChart"></canvas>
        </div>
    </div>

    <script>
        const API_KEY = 'f863a01c2b3c3c5cb27ce25a9f0f8f63';
        const MAX_RECENT_SEARCHES = 5;

        let currentUnit = 'celsius';
        let weatherData = null;
        let recentSearches = JSON.parse(localStorage.getItem('recentSearches')) || [];

        // Add these variables at the top with your other variables
        let autocompleteTimeout;
        const DEBOUNCE_DELAY = 300;

        let temperatureChart = null;

        // Geolocation Functions
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        getWeatherByCoords(
                            position.coords.latitude,
                            position.coords.longitude
                        );
                    },
                    error => {
                        alert("Error: Please enable location permissions.");
                    }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        async function getWeatherByCoords(lat, lon) {
            showLoading(true);
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
                );
                const data = await response.json();

                if (data.cod === 200) {
                    weatherData = data;
                    updateWeatherUI(data);
                    updateRecentSearches(data.name);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                alert(error.message);
            } finally {
                showLoading(false);
            }
        }

        // Modified Get Weather Function
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) return;

            hideAutocomplete(); // Add this line
            showLoading(true);

            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
                );
                const data = await response.json();

                if (data.cod === 200) {
                    weatherData = data;
                    updateWeatherUI(data);
                    updateRecentSearches(city);
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                alert(error.message);
            } finally {
                showLoading(false);
            }
        }

        // Initialize recent searches from localStorage
        recentSearches = JSON.parse(localStorage.getItem('recentSearches')) || [];

        function updateRecentSearches(city) {
            // Remove duplicates and maintain order
            recentSearches = recentSearches.filter(item => item.toLowerCase() !== city.toLowerCase());
            recentSearches.unshift(city);

            // Keep only last 5 searches
            if (recentSearches.length > MAX_RECENT_SEARCHES) {
                recentSearches.pop();
            }

            // Save to localStorage
            localStorage.setItem('recentSearches', JSON.stringify(recentSearches));
            renderRecentSearches();
        }

        function renderRecentSearches() {
            const container = document.getElementById('recentSearches');
            container.innerHTML = recentSearches.length > 0 ?
                '<p>Recent Searches:</p>' : '';

            recentSearches.forEach(city => {
                const btn = document.createElement('button');
                btn.textContent = city;
                btn.onclick = () => {
                    document.getElementById('cityInput').value = city;
                    getWeather();
                };
                container.appendChild(btn);
            });
        }


        function updateWeatherUI(data) {
            document.getElementById('weatherCard').style.display = 'block';

            // Update basic info
            document.getElementById('cityName').textContent = `${data.name}, ${data.sys.country}`;
            document.getElementById('weatherDesc').textContent = data.weather[0].description;
            document.getElementById('temperature').textContent = Math.round(data.main.temp);
            document.getElementById('feelsLike').textContent = Math.round(data.main.feels_like);

            // Update details
            document.getElementById('humidity').textContent = data.main.humidity;
            document.getElementById('windSpeed').textContent = (data.wind.speed * 3.6).toFixed(1);
            document.getElementById('pressure').textContent = data.main.pressure;

            // Update weather icon
            const icon = document.getElementById('weatherIcon');
            icon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
            icon.alt = data.weather[0].description;

            // Set default unit
            toggleUnit(currentUnit);

            getForecast(data.coord.lat, data.coord.lon);

            getAirQuality(data.coord.lat, data.coord.lon);
        }

        function toggleUnit(unit) {
            currentUnit = unit;
            const tempElement = document.getElementById('temperature');
            const feelsLikeElement = document.getElementById('feelsLike');
            const tempUnitElement = document.getElementById('tempUnit');
            const feelsLikeUnitElement = document.getElementById('feelsLikeUnit');

            if (unit === 'celsius') {
                tempElement.textContent = Math.round(weatherData.main.temp);
                feelsLikeElement.textContent = Math.round(weatherData.main.feels_like);
                tempUnitElement.textContent = '°C';
                feelsLikeUnitElement.textContent = '°C';
                document.getElementById('celsiusBtn').classList.add('active');
                document.getElementById('fahrenheitBtn').classList.remove('active');
            } else {
                const fahrenheitTemp = (weatherData.main.temp * 9 / 5) + 32;
                const fahrenheitFeelsLike = (weatherData.main.feels_like * 9 / 5) + 32;
                tempElement.textContent = Math.round(fahrenheitTemp);
                feelsLikeElement.textContent = Math.round(fahrenheitFeelsLike);
                tempUnitElement.textContent = '°F';
                feelsLikeUnitElement.textContent = '°F';
                document.getElementById('fahrenheitBtn').classList.add('active');
                document.getElementById('celsiusBtn').classList.remove('active');
            }

            // Update wind speed units
            const windElement = document.getElementById('windSpeed');
            if (unit === 'celsius') {
                windElement.textContent = (weatherData.wind.speed * 3.6).toFixed(1) + ' km/h';
            } else {
                windElement.textContent = (weatherData.wind.speed * 2.237).toFixed(1) + ' mph';
            }
        }

        function showLoading(show) {
            document.querySelector('.loading').style.display = show ? 'block' : 'none';
        }

        // Initial render of recent searches
        renderRecentSearches();

        // Handle Enter key
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getWeather();
        });

        //Experimental features 1. 5-day forecast
        async function getForecast(lat, lon) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
                );
                const data = await response.json();
                renderForecast(data);
                createTemperatureChart(data.list.slice(0, 8)); // Show first 24 hours (8*3hr intervals)
            } catch (error) {
                console.error('Error loading forecast:', error);
            }
        }

        // Add this function
        function createTemperatureChart(hourlyData) {
            const ctx = document.getElementById('temperatureChart');
            document.getElementById('chartContainer').style.display = 'block';

            // Destroy existing chart
            if (temperatureChart) {
                temperatureChart.destroy();
            }

            temperatureChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: hourlyData.map(h =>
                        new Date(h.dt * 1000).toLocaleTimeString([], { hour: 'numeric', hour12: true })
                    ),
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: hourlyData.map(h => h.main.temp),
                        borderColor: '#FF6B6B',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: 'white'
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: 'white',
                                callback: function (value) {
                                    return value + '°';
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderForecast(data) {
            const forecastContainer = document.getElementById('forecastContainer');
            const forecastCards = document.getElementById('forecastCards');
            forecastContainer.style.display = 'block';
            forecastCards.innerHTML = '';

            // Group by day
            const dailyForecast = data.list.filter(item =>
                item.dt_txt.includes('12:00:00')
            );

            dailyForecast.forEach(day => {
                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <p>${new Date(day.dt * 1000).toLocaleDateString('en', { weekday: 'short' })}</p>
                    <img src="https://openweathermap.org/img/wn/${day.weather[0].icon}.png">
                    <p>${Math.round(day.main.temp)}°</p>
                `;
                forecastCards.appendChild(card);
            });
        }
        // Call getForecast() in updateWeatherUI after successful data fetch

        //2.city autocomplete

        document.getElementById('cityInput').addEventListener('input', handleAutocomplete);

        function handleAutocomplete(e) {
            clearTimeout(autocompleteTimeout);
            const input = e.target.value.trim();

            if (input.length < 2) {
                hideAutocomplete();
                return;
            }

            autocompleteTimeout = setTimeout(() => {
                fetchAutocompleteSuggestions(input);
            }, DEBOUNCE_DELAY);
        }

        async function fetchAutocompleteSuggestions(query) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=${API_KEY}`
                );
                const cities = await response.json();
                showAutocomplete(cities);
            } catch (error) {
                console.error('Autocomplete error:', error);
                hideAutocomplete();
            }
        }

        function showAutocomplete(cities) {
            const dropdown = document.getElementById('autocompleteDropdown');
            dropdown.innerHTML = '';

            if (!cities || cities.length === 0) {
                hideAutocomplete();
                return;
            }

            cities.forEach(city => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';

                // Clean formatting for display
                let displayText = city.name;
                if (city.state && city.country) {
                    displayText += `, ${city.state}, ${city.country}`;
                } else if (city.country) {
                    displayText += `, ${city.country}`;
                }

                item.textContent = displayText;
                item.onclick = () => {
                    // Store the complete city data for more accurate search
                    document.getElementById('cityInput').value = city.name;
                    hideAutocomplete();
                    getWeather();
                };
                dropdown.appendChild(item);
            });

            dropdown.style.display = 'block';
        }

        function hideAutocomplete() {
            document.getElementById('autocompleteDropdown').style.display = 'none';
        }

        // Add this to hide autocomplete when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                hideAutocomplete();
            }
        });

        //3.Theme switching

        function toggleTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            // Update button active states
            document.querySelectorAll('.theme-switcher button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`.theme-switcher button[onclick="toggleTheme('${theme}')"]`)
                .classList.add('active');
        }

        // Update your loadPreferences function
        function loadPreferences() {
            const saved = JSON.parse(localStorage.getItem('preferences'));
            if (saved) {
                toggleTheme(saved.theme);
                toggleUnit(saved.unit);
            } else {
                // Set default theme based on time of day
                const hours = new Date().getHours();
                const defaultTheme = (hours > 6 && hours < 18) ? 'day' : 'night';
                toggleTheme(defaultTheme);
            }
        }

        // Call this when the page loads
        loadPreferences();

        // Add this to automatically switch themes at sunrise/sunset
        function updateThemeBasedOnTime() {
            const hours = new Date().getHours();
            const currentTheme = document.documentElement.getAttribute('data-theme');

            if (hours > 6 && hours < 18) {
                if (currentTheme !== 'day') toggleTheme('day');
            } else {
                if (currentTheme !== 'night') toggleTheme('night');
            }
        }

        // Check every hour
        setInterval(updateThemeBasedOnTime, 3600000);

        // Initial check
        updateThemeBasedOnTime();

        //4. error handling
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            setTimeout(() => errorDiv.remove(), 3000);
        }

        //5. Save preferences
        function savePreferences() {
            const preferences = {
                unit: currentUnit,
                theme: localStorage.getItem('theme') || 'light'
            };
            localStorage.setItem('preferences', JSON.stringify(preferences));
        }

        // Load on startup
        function loadPreferences() {
            const saved = JSON.parse(localStorage.getItem('preferences'));
            if (saved) {
                toggleTheme(saved.theme);
                toggleUnit(saved.unit);
            }
        }

        //6. AQI
        async function getAirQuality(lat, lon) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`
                );

                if (!response.ok) throw new Error('AQI data unavailable');

                const data = await response.json();

                if (data.list && data.list.length > 0) {
                    updateAQI(data.list[0].main.aqi);
                } else {
                    throw new Error('No AQI data available');
                }
            } catch (error) {
                console.error('AQI error:', error);
                document.getElementById('aqiText').textContent = 'Not available';
                document.getElementById('aqiValue').textContent = '-';
            }
        }

        function updateAQI(aqi) {
            const aqiMap = {
                1: { text: 'Good', class: 'aqi-good' },
                2: { text: 'Fair', class: 'aqi-fair' },
                3: { text: 'Moderate', class: 'aqi-moderate' },
                4: { text: 'Poor', class: 'aqi-poor' },
                5: { text: 'Very Poor', class: 'aqi-very-poor' }
            };

            const badge = document.getElementById('aqiBadge');
            const valueElement = document.getElementById('aqiValue');
            const textElement = document.getElementById('aqiText');


            badge.className = 'aqi-badge';

            if (aqi in aqiMap) {
                badge.classList.add(aqiMap[aqi].class);
                valueElement.textContent = aqi;
                textElement.textContent = aqiMap[aqi].text;
            } else {
                valueElement.textContent = '-';
                textElement.textContent = 'No data';
            }
        }

        function shareWeather() {
            const shareSection = document.getElementById('socialShare');
            shareSection.style.display = shareSection.style.display === 'none' ? 'flex' : 'none';
        }

        async function copyLink() {
            try {
                const city = document.getElementById('cityName').textContent;
                const temp = document.getElementById('temperature').textContent;
                const unit = document.getElementById('tempUnit').textContent;
                const url = `${window.location.href}?city=${encodeURIComponent(city)}`;

                await navigator.clipboard.writeText(
                    `Check out ${city}'s weather: ${temp}${unit}\n${url}`
                );
                alert('Link copied to clipboard!');
            } catch (error) {
                console.error('Copy failed:', error);
            }
        }

        function shareTwitter() {
            const text = `Current weather in ${document.getElementById('cityName').textContent}: 
        ${document.getElementById('temperature').textContent}${document.getElementById('tempUnit').textContent} 
        - Check it out on WeatherWise!`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`);
        }

        function shareFacebook() {
            const url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`);
        }

        // Web Share API for native sharing
        function nativeShare() {
            if (navigator.share) {
                navigator.share({
                    title: 'WeatherWise Report',
                    text: `Check out the weather in ${document.getElementById('cityName').textContent}`,
                    url: window.location.href
                });
            } else {
                shareWeather(); // Fallback to custom share
            }
        }

    </script>
